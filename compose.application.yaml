# Run after local initialization; stop host application processes first.
services:
  gateway:
    build: .
    environment:
      APP_ENV: development
      ACADEMIC_MODEL_PROVIDER: ${ACADEMIC_MODEL_PROVIDER:-anthropic}
      OCR_PROVIDER: ${OCR_PROVIDER:-tesseract}
      OMR_MODEL_PROVIDER: ${OMR_MODEL_PROVIDER:-bubble_classifier}
      HTTP_ADDR: 0.0.0.0:8080
      PUBLIC_ORIGIN: http://localhost:3000
      DATABASE_URL: postgres://workspace:${DATABASE_PASSWORD:?required}@database:5432/workspace?sslmode=disable
      MFA_KEY: ${MFA_KEY:?required}
      OBJECT_ENDPOINT: http://objects:8333
      OBJECT_BUCKET: private-workspace
      OBJECT_USER: ${OBJECT_USER:?required}
      OBJECT_PASSWORD: ${OBJECT_PASSWORD:?required}
    depends_on:
      database:
        condition: service_healthy
    ports: ["127.0.0.1:8080:8080"]
    restart: unless-stopped
  worker:
    build: .
    entrypoint: [/app/worker]
    environment:
      APP_ENV: development
      ACADEMIC_MODEL_PROVIDER: ${ACADEMIC_MODEL_PROVIDER:-anthropic}
      OCR_PROVIDER: ${OCR_PROVIDER:-tesseract}
      OMR_MODEL_PROVIDER: ${OMR_MODEL_PROVIDER:-bubble_classifier}
      VISION_BASE_URL: ${VISION_BASE_URL:-}
      VISION_API_KEY: ${VISION_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      DATABASE_URL: postgres://workspace:${DATABASE_PASSWORD:?required}@database:5432/workspace?sslmode=disable
      SMTP_ADDR: mail:1025
      SMTP_FROM: security@workspace.invalid
      OBJECT_ENDPOINT: http://objects:8333
      OBJECT_BUCKET: private-workspace
      OBJECT_USER: ${OBJECT_USER:?required}
      OBJECT_PASSWORD: ${OBJECT_PASSWORD:?required}
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
  vision:
    profiles: [vision]
    build: ./inference
    environment:
      VISION_API_KEY: ${VISION_API_KEY:-}
    volumes: ["vision-models:/models"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://gateway:8080
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [gateway]
    restart: unless-stopped

volumes:
  vision-models:
