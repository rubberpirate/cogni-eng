version: '2'
run:
  timeout: 5m
  build-tags: [integration]
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - sqlclosecheck
    - nolintlint
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
